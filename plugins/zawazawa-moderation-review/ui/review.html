          || cards.querySelector('.card[data-choice="undecided"]');
        if (!undecided) return;
        undecided.scrollIntoView({ behavior: "smooth", block: "center" });
        undecided.querySelector(".choice")?.focus({ preventScroll: true });
      });

      // allow-modalsが無いサンドボックスではshowModal()が失敗する。show()で開いた場合は
      // 背景が操作できてしまうため、可視化・フォーカス移動・Escでの閉じるを自前で補う。
      let dialogFallback = false;

      function openConfirmDialog() {
        dialogFallback = false;
        $("#cancel-submit").textContent = "戻る";
        try {
          dialog.showModal();
        } catch (cause) {
          dialogFallback = true;
          dialog.show();
          // 非モーダルは通常フロー位置に出るため、画面外のままになりうる。
          dialog.scrollIntoView({ block: "center" });
        }
        $("#confirm-submit").focus({ preventScroll: true });
      }

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape" || !dialogFallback || !dialog.open) return;
        event.preventDefault();
        dialog.close();
      });

      dialog.addEventListener("close", () => {
        dialogFallback = false;
        $("#review-submit").focus({ preventScroll: true });
      });

      $("#review-submit").addEventListener("click", () => {
        const value = counts();
        $("#confirm-summary").textContent = `推奨どおり承認 ${value.approve}件、変更して承認 ${value.alternative}件、保留 ${value.hold}件を送信します。未選択 ${value.undecided}件は送信しません。`;
        $("#dialog-error").classList.remove("notice");
        $("#dialog-error").hidden = true;
        openConfirmDialog();
      });

      $("#cancel-submit").addEventListener("click", () => dialog.close());
      function messageOf(cause) {
        return cause instanceof Error ? cause.message : String(cause);
      }

      $("#confirm-submit").addEventListener("click", async () => {
        const button = $("#confirm-submit");
        const error = $("#dialog-error");
        button.disabled = true;
        button.dataset.busy = "true";
        error.classList.remove("notice");
        error.hidden = true;
        try {
          const result = await callTool("submit_moderation_decisions", {
            batchId: state.batch.batchId,
            snapshotToken: state.batch.snapshotToken,
            decisions: buildDecisions(),
          });
          const next = structuredOf(result);
          if (next?.batchId !== state.batch.batchId || !next?.submission) {
            throw new Error("判断の保存結果を確認できませんでした。会話へ戻り、バッチの状態を確認してください。");
          }
          state.submitted = true;
          state.batch.items.forEach((item) => syncCard(item.id));
          persist();
          updateProgress();
        } catch (cause) {
          // 送信自体が失敗した場合だけ再送信を許す。
          error.textContent = messageOf(cause);
          error.hidden = false;
          button.disabled = false;
          button.dataset.busy = "false";
          return;
        }

        // ここから先は送信済み。アプリから会話へメッセージを送るAPIは、ホスト側で
        // 新しいユーザー入力の確認を出す。レビューの最終確認と二重になるため呼ばない。
        // 保存済み判断は元のタスクがget_moderation_reviewで読み戻す。
        button.dataset.busy = "false";
        button.textContent = "送信済み";
        $("#confirm-title").textContent = "判断を保存しました";
        $("#cancel-submit").textContent = "閉じる";
        error.classList.add("notice");
        error.textContent = `判断を保存しました。これが実行許可です。追加の許可は不要です。この画面を閉じ、元のタスクで「バッチ ${state.batch.batchId} の承認済み操作を実行してください」と伝えてください。`;
        error.hidden = false;
      });

      // [report-mode:start]
      // 結果報告は、同じ一覧から編集する要素を落とした読み取り専用表示にする。
      // 判断はすでに保存済みなので、この画面はホストへもサーバーへも一切呼び出さない。
      const EXECUTION_STATUS_LABELS = {
        confirmed: "実行を確認",
        no_action_needed: "対応不要（実行前に達成済み）",
        dispatching: "送信済み・結果不明",
        unknown: "結果不明",
        ready: "未送信",
      };

      function stepStatusLabel(step) {
        if (step.journalMismatch) return "実行記録が承認内容と一致しません";
        return EXECUTION_STATUS_LABELS[step.status] || "未実行";
      }

      function stepStatusKind(step) {
        if (step.journalMismatch) return "mismatch";
        return step.status || "none";
      }

      // [report-status:start]
      // 実行許可を作った判断。自律処理は推奨案の承認だけだが、管理者が承認した一覧では
      // 代替案の承認も同じく実行される。実行状態を出す対象からこれを落とさない。
      const REPORT_AUTHORIZING_CHOICES = ["approve", "alternative"];

      // 単位の見出しに出す状態。実行できなかった操作と結果の分からない操作を、
      // 実行済みと同じ見た目へ寄せない。
      function reportUnitStatus(unit) {
        if (unit.choice === "hold") return { label: "保留", choice: "hold" };
        if (!REPORT_AUTHORIZING_CHOICES.includes(unit.choice)) {
          return { label: "判断なし", choice: "attention" };
        }
        if (unit.steps.some((step) => step.journalMismatch)) {
          return { label: "記録の不一致", choice: "attention" };
        }
        if (!unit.steps.length) return { label: "外部操作なし", choice: "approve" };
        // 送信せずに確定した操作も、承認内容として決着している。未実行と混ぜない。
        const settled = (step) =>
          step.status === "confirmed" || step.status === "no_action_needed";
        if (unit.steps.every((step) => step.status === "no_action_needed")) {
          return { label: "対応不要", choice: "approve" };
        }
        if (unit.steps.every(settled)) {
          return { label: "実行済み", choice: "approve" };
        }
        if (unit.steps.some((step) => step.status === "dispatching" || step.status === "unknown")) {
          return { label: "結果不明", choice: "attention" };
        }
        // 一部だけ実行できた単位を未実行と書くと、確認済みの操作までやり直しの対象に見える。
        if (unit.steps.some(settled)) {
          return { label: "一部実行", choice: "attention" };
        }
        return { label: "未実行", choice: "hold" };
      }
      // [report-status:end]

      function reportActionCell(steps, emptyNote) {
        const cell = element("div", { className: "action-cell" });
        if (!steps.length) {
          cell.dataset.actionable = "false";
          cell.append(element("span", { text: emptyNote }));
          return cell;
        }
        steps.forEach((step) => {
          const line = element("div", { className: "action-line" });
          line.append(
            element("strong", { text: step.operationTypeLabel }),
            element("span", {
              className: "action-status",
              text: stepStatusLabel(step),
              attrs: { "data-status": stepStatusKind(step) },
            }),
          );
          if (step.reportCount) {
            line.append(
              element("span", { className: "action-note", text: `対象通報 ${step.reportCount}件` }),
            );
          }
          step.messages.forEach((message) => {
            line.append(
              element("h4", { className: "sent-message-label", text: message.label }),
              element("p", { className: "sent-message", text: message.text }),
            );
            if (typeof message.alreadyDeletedText === "string") {
              line.append(
                element("h4", {
                  className: "sent-message-label",
                  text: `${message.label}（対象が先に削除済みだった場合）`,
                }),
                element("p", { className: "sent-message", text: message.alreadyDeletedText }),
              );
            }
          });
          cell.append(line);
        });
        return cell;
      }

      function reportStepsFor(unit, operationTypes, commentNumber) {
        return unit.steps.filter(
          (step) =>
            operationTypes.includes(step.operationType) &&
            (commentNumber === undefined || step.targetCommentNumber === commentNumber),
        );
      }

      function reportCommentLane(unit, roles) {
        const item = unit.item;
        const lane = element("div", { className: "lane" });
        lane.append(
          element("h3", { className: "lane-title", text: "コメント" }),
          element("h3", { className: "lane-title", text: "実行した操作" }),
        );
        const comments = item.comments || [];
        const byNumber = new Map(comments.map((comment) => [comment.commentNumber, comment]));
        const lookup = commentTreeLookup(comments);
        const groupOf = commentGroupResolver(item, comments, lookup);
        const rows = [
          ...comments.map((comment) => ({
            comment,
            depth: commentDepth(comment, lookup),
            group: groupOf(comment),
          })),
          ...item.recommendation.targets
            .filter((target) => !byNumber.has(target.commentNumber))
            .map((target) => ({ comment: target, depth: 0, group: "同一ツリー" })),
        ];
        if (!rows.length) {
          lane.append(
            element("div", { className: "empty", text: "コメント本文は提供されていません。" }),
            element("div", { className: "action-cell", text: "—", attrs: { "data-actionable": "false" } }),
          );
          return lane;
        }
        appendGroupedRows(lane, rows, ({ comment, depth }) => {
          const role = roles.get(comment.commentNumber) || "";
          const block = comment.body
            ? commentBlock(comment, depth, role, role || "前後文脈")
            : element("article", { className: "comment-item", attrs: { "data-role": role } }, [
                element("div", { className: "comment-meta" }, [
                  element("span", { className: "comment-number", text: commentNumberText(comment) }),
                  element("span", { className: "comment-state", text: comment.currentState || "" }),
                ]),
                element("p", { className: "empty", text: "本文はこの一覧に含まれていません。" }),
              ]);
          return [
            block,
            reportActionCell(
              reportStepsFor(unit, COMMENT_OPERATION_TYPES, comment.commentNumber),
              "このコメントへの操作はありません。",
            ),
          ];
        });
        return lane;
      }

      function createReportCard(unit, index, total) {
        const item = unit.item;
        const status = reportUnitStatus(unit);
        const card = element("article", {
          className: "card",
          attrs: { "data-id": item.id, "data-choice": status.choice },
        });
        const head = element("header", { className: "card-head" });
        const heading = element("div");
        const kicker = element("div", { className: "card-kicker" });
        kicker.append(
          element("span", { className: "card-index", text: `案件 ${index + 1} / ${total}` }),
          element("span", { className: "status-chip", text: status.label }),
        );
        const postLine = element("div", { className: "post-line" });
        postLine.append(element("h2", { text: item.title || `投稿 ${item.id}` }));
        const judgment = element("details", { className: "judgment-details" });
        judgment.append(
          element("summary", { text: "適用した基準" }),
          element("ul", {}, (item.basis || []).map((text) => element("li", { text }))),
        );
        heading.append(kicker, postLine, judgment);
        const links = element("div", { className: "links" });
        if (item.publicUrl) links.append(link("公開画面", item.publicUrl));
        if (item.adminUrl) links.append(link("管理画面", item.adminUrl));
        head.append(heading, links);

        const body = element("div", { className: "card-body" });
        const roles = commentRoles(item);
        const reportLaneBlock = element("div", { className: "lane" });
        reportLaneBlock.append(
          element("h3", { className: "lane-title", text: reportLaneTitle(item) }),
          element("h3", { className: "lane-title", text: "通報の扱い" }),
          reportListBlock(item),
          reportActionCell(
            reportStepsFor(unit, REPORT_OPERATION_TYPES),
            "通報を閉じる操作はありません。",
          ),
        );
        const historyLaneBlock = element("div", { className: "lane" });
        historyLaneBlock.append(
          element("h3", { className: "lane-title", text: "投稿履歴" }),
          element("h3", { className: "lane-title", text: "投稿規制" }),
          historyDetails(item),
          reportActionCell(
            reportStepsFor(unit, AUTHOR_OPERATION_TYPES),
            "投稿規制の操作はありません。",
          ),
        );
        body.append(reportCommentLane(unit, roles), reportLaneBlock, historyLaneBlock);
        // どの列にも属さない操作は、単位全体への追加操作としてまとめて出す。
        const laneTypes = [
          ...COMMENT_OPERATION_TYPES,
          ...REPORT_OPERATION_TYPES,
          ...AUTHOR_OPERATION_TYPES,
        ];
        const otherSteps = unit.steps.filter((step) => !laneTypes.includes(step.operationType));
        if (otherSteps.length) {
          const other = element("fieldset", { className: "other-operations" });
          other.append(element("legend", { text: "この投稿への追加操作" }));
          other.append(reportActionCell(otherSteps, ""));
          body.append(other);
        }
        card.append(head, body);
        return card;
      }

      function reportSectionCounts(section) {
        const labels = section.units.map((unit) => reportUnitStatus(unit).label);
        const counted = new Map();
        labels.forEach((label) => counted.set(label, (counted.get(label) || 0) + 1));
        return [...counted.entries()].map(([label, count]) => `${label} ${count}件`).join("・");
      }

      function renderReport(report) {
        // 編集できる要素は隠さず取り除く。保存されたファイルに送信経路を残さない。
        document.querySelector(".toolbar")?.remove();
        document.querySelector(".submit-dock")?.remove();
        document.querySelector("#confirm-dialog")?.remove();
        $("#load-status").hidden = true;
        $("#filter-empty").hidden = true;

        const executed = report.executed;
        $(".eyebrow").textContent = report.displayName || "ZAWAZAWA";
        const checkedAt = $("#checked-at");
        checkedAt.textContent = formatCheckedAt(executed.createdAt);
        checkedAt.dateTime = executed.createdAt || "";
        $("#batch-title").textContent = "自律処理の結果";

        $("#report-executed-section").hidden = false;
        $("#report-executed-note").replaceChildren(
          checkedAt,
          document.createTextNode(` ／ ${reportSectionCounts(executed)}`),
        );
        // 一覧の自由なタイトルはWiki名・日付を重ねるため表示しない。
        const record = element("details", { className: "judgment-details" }, [
          element("summary", { text: "実行記録の識別情報" }),
          element("p", { className: "report-note", text: `バッチ ${executed.batchId}` }),
        ]);
        $("#report-executed-section").append(record);
        if (executed.blockedDependencyGroups?.length) {
          const blocked = $("#report-executed-blocked");
          blocked.hidden = false;
          blocked.textContent = `依存グループ ${executed.blockedDependencyGroups
            .map((group) => group.group)
            .join("、")} は、共有する処置を部分的に実行しないため実行対象から外れています。`;
        }
        cards.replaceChildren(
          ...executed.units.map((unit, index) =>
            createReportCard(unit, index, executed.units.length),
          ),
        );
      }
      // [report-mode:end]

      function applyHostContext(hostContext) {
        const theme = hostContext?.theme;
        if (theme === "light" || theme === "dark") {
          document.documentElement.style.colorScheme = theme;
        }
      }

      async function initializeHost() {
        // window.openaiを持つホストはツール出力を直接渡すため、ハンドシェイクを行わない。
        if (window.openai) {
          // toolOutputは読み込み時点で未設定のことがあり、その場合は後からglobalsが配られる。
          window.addEventListener("openai:set_globals", () => {
            if (window.openai?.toolOutput) loadBatchSummary(window.openai.toolOutput);
          });
          if (window.openai.toolOutput) loadBatchSummary(window.openai.toolOutput);
          return;
        }
        const App = window.McpApps?.App;
        if (!App) {
          // SDKが埋め込まれていないHTMLは、接続できないまま操作させない。
          failLoad("一覧UIの読み込みに失敗しました。会話へ戻り、一覧の再表示を依頼してください。");
          return;
        }
        app = new App({ name: "zawazawa-moderation-review", version: "0.2.0" });
        // 受信の登録はconnectより前に済ませる。接続直後の通知を取りこぼさないため。
        app.ontoolresult = (params) => loadBatchSummary(params?.structuredContent);
        app.onhostcontextchanged = (params) => applyHostContext(params?.hostContext ?? params);
        try {
          await app.connect();
          applyHostContext(app.getHostContext());
          startToolResultWait();
        } catch (cause) {
          $("#load-status").textContent =
            "ホストと接続できませんでした。会話へ戻り、一覧の再表示を依頼してください。";
        }
      }

      // 結果報告として書き出されたHTMLはホストを持たない。判断を集める経路へ入らない。
      if (window.__zawazawaReport) {
        renderReport(window.__zawazawaReport);
      } else {
        initializeHost();
      }
    })();
  </script>
</body>
</html>
